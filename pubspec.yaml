name: quickhire1
description: A job posting app built with Flutter.

publish_to: 'none' # Remove this line if you plan to publish the app

version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  firebase_auth: ^5.5.1
  firebase_auth_web: ^5.5.1
  firebase_core: ^3.12.1
  google_fonts: ^6.1.0
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.3.0
  image_picker: ^1.1.2
  firebase_storage: ^12.4.4
  geolocator: ^13.0.3
  geocoding: ^3.0.0
  mapbox_search: ^4.3.1
  google_maps_flutter: ^2.12.0
  http: ^1.3.0
  location: ^8.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assests/assests/default_avatar.png

